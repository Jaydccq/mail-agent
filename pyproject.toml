[project]
name = "mail-agent"
version = "0.2.0"
description = "Always-on personal email agent: Gmail (IMAP) + Jev triage + subscription/API models + Telegram/Lark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "imapclient>=3.0,<5",  # mail/imap.py 的 _start_idle 用到 imapclient 内部的 _imap/_idle_tag
    "lark-oapi>=1.7.5,<1.8",  # channels/lark.py 改写了 SDK 内部的 ws.client.loop、_conn、_disconnect；只对 1.7.5 源码验证过
    "markdown-it-py>=3",  # channels/chat_format.py：模型回复里的 Markdown → Telegram HTML / 飞书卡片
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4"]

[project.scripts]
mail-agent = "mailagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]  # pyflakes + bugbear：只查真问题，不管风格

[tool.mypy]
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["imapclient.*", "lark_oapi.*"]  # 没有类型信息
ignore_missing_imports = true
